<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Edge Showroom</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/showroom.css">
</head>
<body>
    <div id="site-header"></div>

    <main style="padding-top: 80px;">
        <!-- Hero Section -->
        <section id="home" class="hero-section">
            <ul class="bg-bubbles">
                <li></li><li></li><li></li><li></li><li></li><li></li>
            </ul>
            <div class="hero-content">
                <h1 class="hero-title">
                    Redefine Your <br />
                    <span>Signature Look</span>
                </h1>
                <p class="hero-subtitle">
                    Step into the new season with confidence. Explore our latest collection of trendy, premium menswear designed exclusively for you.
                </p>
                <a href="shirts/formal.html" class="explore-btn" style="display: inline-block; text-decoration: none;">Explore Collection</a>
            </div>

            <div class="scene">
                <div class="carousel">
                    <div class="carousel-item item-1" style="background-image: url('public/home_page/carousel_image/img1.jpg')"></div>
                    <div class="carousel-item item-2" style="background-image: url('public/home_page/carousel_image/img2.jpg')"></div>
                    <div class="carousel-item item-3" style="background-image: url('public/home_page/carousel_image/img3.jpg')"></div>
                    <div class="carousel-item item-4" style="background-image: url('public/home_page/carousel_image/img4.jpg')"></div>
                    <div class="carousel-item item-5" style="background-image: url('public/home_page/carousel_image/img5.jpg')"></div>
                    <div class="carousel-item item-6" style="background-image: url('public/home_page/carousel_image/img6.jpg')"></div>
                    <div class="carousel-item item-7" style="background-image: url('public/home_page/carousel_image/img7.jpg')"></div>
                </div>
            </div>
        </section>

        <!-- Product Carousel Section -->
        <section class="product-carousel-section">
            <div class="carousel-header">
                <h2>New <span>Collections</span></h2>
                <div class="carousel-controls">
                    <button id="scroll-left">&#8592;</button>
                    <button id="scroll-right">&#8594;</button>
                </div>
            </div>
            
            <div class="product-carousel-container" id="product-carousel">
                <!-- Products will be injected via JS -->
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <!-- Common Layout Scripts -->
    <script src="includes/header.js"></script>
    <script src="includes/footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
